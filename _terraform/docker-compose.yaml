services:
  mc:
    image: itzg/minecraft-server
    ports:
      - "25565:25565"
    environment:
      EULA: "true"
      VERSION: 1.20.1
      MODPACK_PLATFORM: MODRINTH
      MODRINTH_MODPACK: https://modrinth.com/modpack/drehmalmodlist/version/1.6.0
      RCON_CMDS_STARTUP:  |-
        gamerule playersSleepingPercentage 0
        pregen start 200
      MEMORY: 8G
    volumes:
      - ./data:/data

volumes:
  data: {}
